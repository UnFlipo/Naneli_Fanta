<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOXES BOXES BOXES BOXES BOXES</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="shortcut icon" href="Amazon.png" width=32px>
    
    <style>
      body{background-color:red;}
      .first { width: fit-content; border: 2px solid black; margin: 1px; padding: 5px; background-color: yellow; transition: transform 0.5s ease; }
      .first:hover { transform: rotate(360deg);}
      
      .box-container {display: flex;align-items: center;gap: 10px;margin-top: 10px;}
      
      .buton { transition: transform 0.3s ease;}
      .buton:active { transform: scale(1.2);}
      
      .paragraf{width: 20px;height: 20px;transition: width 2s, height 2s ease-out;}
      .paragraf:hover{width: 100px;height: 100px}

      .naber{transition: 2s;height:15px;width:450px;opacity:0;}
      .naber:hover{transition: 2s;height:300px;width:300px;opacity:1;}
    </style>
  
  </head>
  
 
  
  <body>
    <h1 style="color:yellow;background-color:black;width:fit-content;">BOXES BECAUSE I DONT KNOW <mark>CSS</mark></h1>
    
    <p title="bu örnek bir fail" class="paragraf" style="color:blue;background-color:black;width:fit-content;">denemeler</p>
    
    <div class="box-container">
      <div class="first"> whatsup </div>
      <input type="text" class="textbox" placeholder="Ne Bakıyon Gardaş" />
      <button title="Basılı tut animasyonu var" class="buton" onclick="document.querySelector('.first').textContent = document.querySelector('.textbox').value" aria-label="Sorun yok.">Basmasana kardeş</button>
    </div>
    <h1 style="color:yellow;background-color:black;width:fit-content;margin-bottom:0px;">NEVERMIND I KNOW NOW <mark>hover below</mark></h1>
    <div class="naber">
        <img src="grupyorum.jpg" alt="Haziranda Ölmek Zor">
    </div>
    
  </body>
</html>
